<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GLSL-Pathtracer-JS</title>
    <script>(function(){var g=new URLSearchParams(location.search).get('generator');if(g==='essl'||g==='pathtracer'||g==='auto')window.__ptForceGenerator=g;}());</script>
    <style>
    :root {
      --bg-0: #111822;
      --bg-1: #1a2433;
      --bg-2: #202d40;
      --line: #36506b;
      --text: #dde9f8;
      --muted: #96afd0;
      --accent: #4fc3ff;
      --accent-2: #84ffd8;
      --panel-shadow: 0 14px 28px rgba(0, 0, 0, 0.36);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Segoe UI", "Arial", sans-serif;
      background:
        radial-gradient(900px 500px at 0% -10%, #2d4e70 0%, transparent 70%),
        radial-gradient(700px 500px at 100% 0%, #1c3d47 0%, transparent 75%),
        linear-gradient(145deg, var(--bg-0), var(--bg-1) 55%, #11151f);
      padding: 16px;
    }

    .app-shell {
      display: grid;
      gap: 16px;
      max-width: 1600px;
      margin: 0 auto;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      grid-template-areas:
        "render input"
        "log input"
        "editor input";
    }

    .card {
      background: linear-gradient(180deg, rgba(37, 54, 74, 0.74), rgba(20, 29, 42, 0.92));
      border: 1px solid rgba(128, 169, 205, 0.26);
      border-radius: 12px;
      box-shadow: var(--panel-shadow);
      backdrop-filter: blur(6px);
    }

    .render-card {
      grid-area: render;
      padding: 14px;
    }

    .log-card {
      grid-area: log;
      padding: 12px;
    }

    .editor-card {
      grid-area: editor;
      padding: 12px;
    }

    .input-card {
      grid-area: input;
      padding: 12px;
      align-self: start;
    }

    .playerCanvas {
      display: block;
      border: 1px solid rgba(131, 187, 232, 0.4);
      outline: none;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.48);
      background: #0f141d;
      touch-action: none;
    }

    .canvas-stage-wrap {
      position: relative;
      width: fit-content;
      margin: 0 auto;
    }

    .scene-stage-overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
      background: none;
      opacity: 1;
      transition: opacity 220ms ease;
    }

    .scene-stage-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .scene-stage-panel {
      min-width: min(82vw, 460px);
      max-width: min(92vw, 560px);
      border-radius: 14px;
      border: 1px solid rgba(142, 207, 255, 0.52);
      background: linear-gradient(180deg, rgba(10, 24, 38, 0.95), rgba(6, 16, 26, 0.97));
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.58), 0 0 0 1px rgba(79, 195, 255, 0.24) inset;
      padding: 18px 20px;
      color: #eaf6ff;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.42);
    }

    .scene-stage-title {
      margin: 0 0 12px 0;
      font-size: 18px;
      letter-spacing: 0.4px;
      color: #c2ebff;
      font-weight: 700;
    }

    .scene-stage-steps {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .scene-stage-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #92abc0;
      font-weight: 600;
    }

    .scene-stage-dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid #557690;
      background: transparent;
      flex: 0 0 auto;
    }

    .scene-stage-item.active {
      color: #ffffff;
    }

    .scene-stage-item.active .scene-stage-dot {
      border-color: #9ae8ff;
      background: #4fc3ff;
      box-shadow: 0 0 0 4px rgba(79, 195, 255, 0.2);
    }

    .scene-stage-item.done {
      color: #bcf4e2;
    }

    .scene-stage-item.done .scene-stage-dot {
      border-color: #84ffd8;
      background: #84ffd8;
    }

    .scene-stage-message {
      margin-top: 12px;
      font-size: 13px;
      color: #96d8ff;
      min-height: 18px;
    }

    .scene-stage-trace {
      margin-top: 10px;
      max-height: 84px;
      overflow: auto;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(116, 172, 208, 0.22);
      background: rgba(7, 14, 23, 0.46);
      color: rgba(210, 232, 247, 0.74);
      font-family: "Fira Mono", monospace;
      font-size: 11px;
      line-height: 1.3;
      white-space: pre-wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      min-height: 44px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin: 2px;
      color: #0f2738;
      background: linear-gradient(95deg, var(--accent), var(--accent-2));
      box-shadow: 0 3px 10px rgba(90, 204, 255, 0.22);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-1px);
      filter: brightness(1.08);
      outline: 2px solid rgba(149, 245, 255, 0.5);
      outline-offset: 2px;
    }

    .shader-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      padding: 8px 8px 2px 8px;
      border-bottom: 1px solid rgba(109, 162, 201, 0.35);
    }

    .shader-tab {
      flex: 0 0 auto;
      border-radius: 9px 9px 0 0;
      min-height: 44px;
      padding: 10px 14px;
      color: #9ab9db;
      background: #172230;
      font-family: monospace, "Courier New";
      font-size: 13px;
      letter-spacing: 0.4px;
    }

    .shader-tab.active {
      color: #e6f5ff;
      background: linear-gradient(180deg, #2d4a66, #1e2e43);
      border-bottom: 2px solid var(--accent);
    }

    .editor-container {
      border: 1px solid rgba(112, 159, 197, 0.4);
      border-radius: 0 0 10px 10px;
      overflow: hidden;
      margin-top: -1px;
      background: #121c2a;
    }

    .CodeMirror {
      width: 100%;
      height: clamp(300px, 56vh, 740px);
      font-family: "Fira Mono", "Menlo", "Monaco", monospace;
      font-size: 14px;
      border: none;
      background: #131d2b !important;
    }

    #log,
    #info {
      margin: 0;
      white-space: pre-wrap;
      background: rgba(11, 18, 27, 0.78);
      color: #89ecff;
      border: 1px solid rgba(100, 174, 206, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: "Fira Mono", monospace;
      font-size: 13px;
      min-height: 42px;
      max-height: 180px;
      overflow: auto;
    }

    #debug {
      visibility: hidden;
      display: block;
      margin-top: 12px;
    }

    .debug-grid {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      margin-top: 8px;
    }

    .buffer-display {
      display: block;
      overflow-x: auto;
      white-space: nowrap;
      padding: 6px 8px;
      border-radius: 6px;
      background: #1b293a;
    }

    .lil-gui {
      max-width: calc(100vw - 20px);
    }

    body.gui-compact .lil-gui {
      font-size: 12px;
      line-height: 1.25;
      --width: min(336px, calc(100vw - 12px));
    }

    body.gui-compact .lil-gui .controller {
      min-height: 24px;
    }

    body.gui-compact .lil-gui .title {
      line-height: 1.2;
      padding-top: 6px;
      padding-bottom: 6px;
    }

    body.gui-compact .lil-gui .name {
      max-width: 48%;
      padding-right: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 480px) {
      body.gui-compact .lil-gui {
        --width: calc(100vw - 10px);
      }
    }

    @media (max-width: 430px) {
      body.gui-compact .lil-gui {
        font-size: 11px;
        line-height: 1.2;
        --width: calc(100vw - 6px);
      }

      body.gui-compact .lil-gui .controller {
        min-height: 22px;
      }

      body.gui-compact .lil-gui .name {
        max-width: 45%;
      }
    }

    @media (max-width: 430px) and (orientation: landscape) {
      body.gui-compact .lil-gui {
        max-height: calc(100vh - 6px);
      }
    }

    @media (max-width: 1200px) {
      .app-shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "render"
          "log"
          "editor"
          "input";
      }

      .input-card {
        max-width: 100%;
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      .render-card,
      .log-card,
      .editor-card,
      .input-card {
        padding: 10px;
      }

      .shader-tab {
        font-size: 12px;
        padding: 10px 12px;
      }

    }
    </style>
    <script>
      (function(){
          var oldLog = console.log;
          console.log = function (...data) {
              var message = data.map(d => {
                  if (typeof d === 'object') {
                      try {
                          return JSON.stringify(d, null, 2);
                      } catch (e) {
                          return String(d);
                      }
                  }
                  return String(d);
              }).join(' ');
              const logger = document.getElementById('log');
              if (logger) logger.innerHTML = message;
              if (typeof window.pushSceneStageTrace === 'function') {
                window.pushSceneStageTrace('log', message);
              }
              
              oldLog.apply(console, arguments);
          };
      })();

      (function(){
          var oldLog = console.info;
          console.info = function (...data) {
              var message = data.map(d => {
                  if (typeof d === 'object') {
                      try {
                          return JSON.stringify(d, null, 2);
                      } catch (e) {
                          return String(d);
                      }
                  }
                  return String(d);
              }).join(' ');
              const logger = document.getElementById('info');
              if (logger) logger.innerHTML = message;
              if (typeof window.pushSceneStageTrace === 'function') {
                window.pushSceneStageTrace('info', message);
              }
          };
      })();

      (function(){
          var oldClear = console.clear;
          console.clear = function (...data) {
              const logger = document.getElementById('info');
              if (logger) logger.innerHTML = '';
          };
      })();

      async function watchInit() {
        const canvas = document.getElementById('canvas');

        const config = {
          document: document,
          canvas: canvas
        };

        if (typeof window.updateSceneStageIndicator === 'function') {
          window.updateSceneStageIndicator('loading', 'Chargement de la scene');
        }

        await window.loadSceneAsync(config);
      }

      (function() {
        const stageOrder = ['loading', 'processing', 'compile', 'launch'];
        const traceBuffer = [];
        const maxTraceLines = 6;
        const launchRenderMessage = 'Lancement du rendu';
        let lastStage = '';

        function updateSceneStageTraceView() {
          const traceEl = document.getElementById('scene-stage-trace');
          if (!traceEl) return;
          traceEl.textContent = traceBuffer.join('\n');
        }

        function isLaunchRenderMessage(stage, message) {
          return (stage === 'launch');
        }

        window.pushSceneStageTrace = function(source, message) {
          if (!message) return;
          const text = String(message).replace(/\s+/g, ' ').trim();
          if (!text) return;
          traceBuffer.push('[' + source + '] ' + text);
          if (traceBuffer.length > maxTraceLines) {
            traceBuffer.shift();
          }
          updateSceneStageTraceView();
        };

        function updateSceneStageIndicator(stage, message) {
          const overlay = document.getElementById('scene-stage-overlay');
          const messageEl = document.getElementById('scene-stage-message');
          if (!overlay) return;

          if (isLaunchRenderMessage(stage, message)) {
            overlay.classList.add('hidden');
            return;
          }

          if (stage && stage !== lastStage) {
            lastStage = stage;
            traceBuffer.length = 0;
            updateSceneStageTraceView();

            const logger = document.getElementById('log');
            if (logger) logger.innerHTML = '';
            const info = document.getElementById('info');
            if (info) info.innerHTML = '';
          }

          overlay.classList.remove('hidden');

          const stageIndex = stageOrder.indexOf(stage);
          for (let i = 0; i < stageOrder.length; i++) {
            const stepEl = document.querySelector('[data-stage-item="' + stageOrder[i] + '"]');
            if (!stepEl) continue;
            stepEl.classList.remove('active', 'done');
            if (i < stageIndex) {
              stepEl.classList.add('done');
            } else if (i === stageIndex) {
              stepEl.classList.add('active');
            }
          }

          if (messageEl) {
            messageEl.textContent = message || '';
          }

          if (message) {
            window.pushSceneStageTrace('stage', message);
          }

        }

        window.updateSceneStageIndicator = updateSceneStageIndicator;
        window.addEventListener('scene-stage', function(ev) {
          const detail = ev && ev.detail ? ev.detail : {};
          updateSceneStageIndicator(detail.stage, detail.message);
        });
      })();
    </script>
  </head>
  <body onload="watchInit()">
    <main class="app-shell">
      <div class="canvas-stage-wrap">
        <canvas id="canvas" class="playerCanvas"></canvas>
        <div id="scene-stage-overlay" class="scene-stage-overlay" aria-live="polite" aria-atomic="true">
          <div class="scene-stage-panel">
            <h2 class="scene-stage-title">Initialisation de la scene</h2>
            <ul class="scene-stage-steps">
              <li class="scene-stage-item active" data-stage-item="loading"><span class="scene-stage-dot"></span>Chargement</li>
              <li class="scene-stage-item" data-stage-item="processing"><span class="scene-stage-dot"></span>Traitement</li>
              <li class="scene-stage-item" data-stage-item="compile"><span class="scene-stage-dot"></span>Compilation des shaders</li>
              <li class="scene-stage-item" data-stage-item="launch"><span class="scene-stage-dot"></span>Lancement du rendu</li>
            </ul>
            <div id="scene-stage-message" class="scene-stage-message">Chargement de la scene</div>
            <pre id="scene-stage-trace" class="scene-stage-trace" aria-label="Traces de progression"></pre>
          </div>
        </div>
      </div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/": "./node_modules/three/"
        }
      }
    </script>

    <script type="module">
      import { Main } from './dist-min/main.js';
      import { GL } from './dist-min/core/GL.js';

      window.loadSceneAsync = async function(config) {
        await Main.instance.runAsync(config);
      }

    </script>

  </body>
</html>
